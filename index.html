<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tap Counter</title>
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0e11;
      --text: #f4f4f6;
      --muted: #8a8a94;
      --line: rgba(255, 255, 255, 0.09);
      --red-top: #cc4a41;
      --red-bottom: #a8362f;
      --green-top: #3e8d5d;
      --green-bottom: #2b6c45;
      --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(255, 255, 255, 0.05), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app {
      width: 100%;
      max-width: 1040px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      height: clamp(320px, 64vh, 580px);
    }

    .panel {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border: 0;
      border-radius: 28px;
      color: inherit;
      font: inherit;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        inset 0 0 0 1px rgba(255, 255, 255, 0.06),
        0 1px 2px rgba(0, 0, 0, 0.4),
        0 24px 48px -24px rgba(0, 0, 0, 0.7);
      transition:
        transform 140ms var(--ease-out),
        box-shadow 140ms var(--ease-out),
        filter 180ms var(--ease-out);
    }

    .panel[data-key="online"] {
      background: linear-gradient(180deg, var(--red-top), var(--red-bottom));
    }

    .panel[data-key="ePlusR"] {
      background: linear-gradient(180deg, var(--green-top), var(--green-bottom));
    }

    /* Soft sheen that follows the pointer */
    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 30%), rgba(255, 255, 255, 0.12), transparent 60%);
      opacity: 0;
      transition: opacity 220ms var(--ease-out);
      pointer-events: none;
    }

    .panel:hover::before {
      opacity: 1;
    }

    /* Dark wash used to acknowledge an undo */
    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.22);
      opacity: 0;
      pointer-events: none;
    }

    .panel.is-undo::after {
      animation: undo-wash 380ms var(--ease-out);
    }

    @keyframes undo-wash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    .panel:active,
    .panel.is-pressed {
      transform: translateY(1px) scale(0.99);
      filter: brightness(0.96);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 0 rgba(0, 0, 0, 0),
        0 10px 24px -18px rgba(0, 0, 0, 0.7);
    }

    .panel:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.75);
      outline-offset: 4px;
    }

    .label {
      position: relative;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.74);
    }

    .count {
      position: relative;
      font-size: clamp(5rem, 11vw, 9.5rem);
      font-weight: 300;
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .count.bump-up { animation: bump-up 220ms var(--ease-out); }
    .count.bump-down { animation: bump-down 260ms var(--ease-out); }

    @keyframes bump-up {
      0% { transform: translateY(6px); opacity: 0.6; }
      100% { transform: none; opacity: 1; }
    }

    @keyframes bump-down {
      0% { transform: translateY(-6px); opacity: 0.6; }
      100% { transform: none; opacity: 1; }
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 4px;
    }

    .hint {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .hint kbd {
      font: inherit;
      font-size: 0.78rem;
      padding: 2px 8px;
      margin-right: 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }

    .reset {
      padding: 9px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: color 150ms, background-color 150ms, border-color 150ms;
    }

    .reset:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .reset:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.75);
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      body { padding: 16px; align-items: stretch; }
      .panels { grid-template-columns: 1fr; height: auto; gap: 14px; }
      .panel { min-height: 36vh; border-radius: 22px; }
      .count { font-size: clamp(4.5rem, 24vw, 7rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      .panel, .panel::before { transition: none; }
      .count.bump-up, .count.bump-down, .panel.is-undo::after { animation: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="panels">
      <button type="button" class="panel" data-key="online" data-pitch="1.12" aria-label="online">
        <span class="label">online</span>
        <span class="count" data-count="online">0</span>
      </button>
      <button type="button" class="panel" data-key="ePlusR" data-pitch="0.9" aria-label="E&amp;R">
        <span class="label">E&amp;R</span>
        <span class="count" data-count="ePlusR">0</span>
      </button>
    </div>

    <div class="footer">
      <div class="hint">
        <span><kbd>Click</kbd>add one</span>
        <span><kbd>Right-click</kbd>undo</span>
      </div>
      <button type="button" class="reset" id="reset">Reset</button>
    </div>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = "tap-counter-v1";
      const defaultState = { online: 0, ePlusR: 0 };

      function sanitize(value) {
        const n = Number(value);
        return Number.isFinite(n) ? Math.max(0, Math.floor(n)) : 0;
      }

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { ...defaultState };
          const data = JSON.parse(raw);
          return { online: sanitize(data.online), ePlusR: sanitize(data.ePlusR) };
        } catch (e) {
          return { ...defaultState };
        }
      }

      function save(state) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      function restartClass(el, cls) {
        el.classList.remove("bump-up", "bump-down", "is-undo");
        void el.offsetWidth; // reflow so the animation replays
        el.classList.add(cls);
      }

      function render(state, key, direction) {
        Object.keys(state).forEach(function (k) {
          document.querySelector('[data-count="' + k + '"]').textContent = String(state[k]);
        });
        if (key && direction) {
          restartClass(document.querySelector('[data-count="' + key + '"]'), direction > 0 ? "bump-up" : "bump-down");
        }
      }

      /* ---------- Sound: synthesised mechanical key-switch ---------- */

      let audioCtx = null;
      let master = null;
      let noiseBuffer = null;

      function ensureAudio() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!audioCtx) {
          audioCtx = new AC({ latencyHint: "interactive" });
          const comp = audioCtx.createDynamicsCompressor();
          comp.threshold.value = -12;
          comp.ratio.value = 4;
          master = audioCtx.createGain();
          master.gain.value = 0.9;
          master.connect(comp);
          comp.connect(audioCtx.destination);

          const len = Math.floor(audioCtx.sampleRate * 0.2);
          noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      // Short band-passed noise burst: the "click" of plastic on plastic
      function snap(ctx, t, freq, q, level, decay) {
        const src = ctx.createBufferSource();
        src.buffer = noiseBuffer;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = freq;
        filter.Q.value = q;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(level, t + 0.0015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
        src.connect(filter);
        filter.connect(g);
        g.connect(master);
        src.start(t, Math.random() * 0.15);
        src.stop(t + decay + 0.02);
      }

      // Pitch-dropping sine: the low "thock" of the key bottoming out
      function body(ctx, t, from, to, level, decay) {
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(from, t);
        osc.frequency.exponentialRampToValueAtTime(to, t + decay);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(level, t + 0.002);
        g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
        osc.connect(g);
        g.connect(master);
        osc.start(t);
        osc.stop(t + decay + 0.02);
      }

      function jitter(amount) {
        return 1 + (Math.random() * 2 - 1) * amount;
      }

      function pressSound(pitch) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const t = ctx.currentTime;
        const p = pitch * jitter(0.03);
        snap(ctx, t, 2400 * p, 1.1, 0.55, 0.022);
        snap(ctx, t, 6200 * p, 3, 0.12, 0.008);
        body(ctx, t, 210 * p, 70, 0.42, 0.07);
      }

      function releaseSound(pitch) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const t = ctx.currentTime;
        const p = pitch * jitter(0.03);
        snap(ctx, t, 4200 * p, 2.2, 0.2, 0.012);
        body(ctx, t, 320 * p, 180, 0.07, 0.03);
      }

      function undoSound(pitch, didChange) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const t = ctx.currentTime;
        const p = pitch * jitter(0.02);
        if (!didChange) {
          // Already at zero: a dull, muted tap
          snap(ctx, t, 900 * p, 0.8, 0.18, 0.02);
          body(ctx, t, 110, 60, 0.18, 0.05);
          return;
        }
        // Two soft, descending clicks read as "step back"
        snap(ctx, t, 1900 * p, 1, 0.38, 0.02);
        body(ctx, t, 160 * p, 60, 0.32, 0.07);
        snap(ctx, t + 0.055, 1300 * p, 1, 0.24, 0.022);
        body(ctx, t + 0.055, 120 * p, 50, 0.2, 0.06);
      }

      /* ---------- Interaction ---------- */

      const state = load();
      render(state);

      function change(panel, delta) {
        const key = panel.getAttribute("data-key");
        const before = state[key];
        state[key] = Math.max(0, before + delta);
        const changed = state[key] !== before;
        if (changed) {
          save(state);
          render(state, key, delta);
        }
        return changed;
      }

      function undo(panel) {
        const pitch = Number(panel.getAttribute("data-pitch")) || 1;
        const changed = change(panel, -1);
        undoSound(pitch, changed);
        restartClass(panel, "is-undo");
      }

      document.querySelectorAll(".panel").forEach(function (panel) {
        const pitch = Number(panel.getAttribute("data-pitch")) || 1;
        let pressed = false;

        panel.addEventListener("pointerdown", function (e) {
          if (e.button !== 0 || e.ctrlKey) return; // ctrl-click opens the context menu on macOS
          pressed = true;
          panel.classList.add("is-pressed");
          pressSound(pitch);
        });

        function lift(playSound) {
          if (!pressed) return;
          pressed = false;
          panel.classList.remove("is-pressed");
          if (playSound) releaseSound(pitch);
        }

        panel.addEventListener("pointerup", function () { lift(true); });
        panel.addEventListener("pointerleave", function () { lift(false); });
        panel.addEventListener("pointercancel", function () { lift(false); });

        panel.addEventListener("pointermove", function (e) {
          const r = panel.getBoundingClientRect();
          panel.style.setProperty("--mx", (e.clientX - r.left) + "px");
          panel.style.setProperty("--my", (e.clientY - r.top) + "px");
        });

        panel.addEventListener("click", function (e) {
          if (e.detail === 0) {
            // Keyboard activation (Enter / Space): no pointer events, so play the full click here
            pressSound(pitch);
            setTimeout(function () { releaseSound(pitch); }, 70);
          }
          change(panel, 1);
        });

        panel.addEventListener("contextmenu", function (e) {
          e.preventDefault();
          undo(panel);
        });

        panel.addEventListener("keydown", function (e) {
          if (e.key === "Backspace" || e.key === "Delete") {
            e.preventDefault();
            undo(panel);
          }
        });
      });

      document.getElementById("reset").addEventListener("click", function () {
        if (!confirm("Reset both counters to zero?")) return;
        state.online = 0;
        state.ePlusR = 0;
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        render(state);
      });
    })();
  </script>
</body>
</html>
